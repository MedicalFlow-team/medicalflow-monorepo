name: Deploy (produção)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-medflow
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # api: contexto raiz — o bun.lock único do workspace vive na raiz
          - { name: api, context: ., file: apps/api/Dockerfile }
          - { name: web, context: ./apps/web, file: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/medicalflow-team/medicalflow-monorepo-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/medicalflow-team/medicalflow-monorepo-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Swarm
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH no VPS e deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.MEDFLOW_VPS_HOST }}
          username: root
          key: ${{ secrets.MEDFLOW_VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /root/medicalflow-monorepo
            # Deploy determinístico: SHA exato do push (a branch local do VPS
            # pode ser outra — git pull sozinho puxaria a branch errada).
            git fetch origin
            git checkout --force "${{ github.sha }}"
            # GHCR: pacotes são privados por padrão. O GITHUB_TOKEN deste job
            # tem packages:write (fez o push) e vale só durante o run —
            # loga o daemon, stack deploy, e sai.
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            bash infra/deploy.sh "${{ github.sha }}"
            docker logout ghcr.io
