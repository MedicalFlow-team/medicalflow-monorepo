name: Validate PostgreSQL backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Run isolated restore drill
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.FLOWCARE_VPS_HOST }}
          username: root
          key: ${{ secrets.FLOWCARE_VPS_SSH_KEY }}
          request_pty: true
          script_stop: true
          script: |
            set -euo pipefail
            cd /root/flowcare
            BACKUP_ENV_FILE=/root/flowcare/backup.env bash infra/backup/restore-drill.sh 20261009T121548Z
            BACKUP_ENV_FILE=/root/flowcare/backup.env bash infra/backup/check-backup.sh
            source infra/backup/common.sh
            backup_alert "issue-203 validation alert test"
            echo "backup_alert_webhook=accepted"
            echo "backup_scope=flowcare-only"
