name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + typecheck + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Type-check (tsc)
        run: bun run typecheck

      - name: Testes
        run: bun test

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      # next build já roda o type-check do TS (sem ignoreBuildErrors)
      - name: Build (Next)
        run: bun run build

  docker:
    name: Docker (imagens constroem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build imagem api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false

      - name: Build imagem web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false

  gitleaks:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Binário OSS direto (docker) — gitleaks-action@v2 passou a exigir licença
      # paga para orgs; a ferramenta em si é Apache-2.0.
      - name: Rodar gitleaks
        run: |
          docker run --rm -v "$PWD:/src" zricethezav/gitleaks:v8.24.3 \
            detect --source /src --redact --exit-code 1
