name: Verify SES events

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Count recent SES webhook events
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.FLOWCARE_VPS_HOST }}
          username: root
          key: ${{ secrets.FLOWCARE_VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            docker service logs flowcare_api --since 2h --raw 2>&1 \
              | awk '
                  { total++ }
                  /ses_event/ {
                    matched++
                    if (match($0, /"status":"(Delivery|Bounce|Complaint)"/)) {
                      status = substr($0, RSTART, RLENGTH)
                      count[status]++
                    }
                  }
                  END {
                    print "log_lines=" total, "ses_events=" matched
                    for (status in count) print status, count[status]
                    if (matched == 0) exit 1
                  }
                '
